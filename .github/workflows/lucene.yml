name: lucene-integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lucene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Install the tested Lucene environment
        run: python -m pip install -c requirements/constraints.txt -e '.[dev,lucene]'
      - name: Run Lucene unit tests
        run: pytest tests/test_artifacts.py tests/test_lexical.py
      - name: Run a real-JVM BM25 smoke test
        env:
          ALL_PROXY: ""
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          all_proxy: ""
          https_proxy: ""
          http_proxy: ""
        run: |
          smoke_dir="${RUNNER_TEMP}/rsb-lucene-smoke"
          mkdir -p "${smoke_dir}"
          printf '%s\n' \
            '{"_id":"d1","title":"Neural retrieval","text":"Dense retrieval uses learned representations."}' \
            '{"_id":"d2","title":"Lexical retrieval","text":"BM25 uses term matching."}' \
            > "${smoke_dir}/corpus.jsonl"
          printf '%s\n' \
            '{"_id":"q1","text":"neural dense retrieval"}' \
            > "${smoke_dir}/queries.jsonl"
          rsb bm25 \
            --corpus "${smoke_dir}/corpus.jsonl" \
            --queries "${smoke_dir}/queries.jsonl" \
            --work-dir "${smoke_dir}/work" \
            --hits 2 \
            --threads 1 \
            --batch-size 1 \
            --include-title \
            --output "${smoke_dir}/run.txt"
          test -s "${smoke_dir}/run.txt"
          grep -q '^q1 Q0 d1 ' "${smoke_dir}/run.txt"
