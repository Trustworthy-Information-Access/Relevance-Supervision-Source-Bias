# Replace <model> and the root with the embedding paths produced by `rsb retrieve`.
# MS MARCO, DL19, and DL20 share one collection and therefore form one group.
suffixes:
  human: -human
  llm: -llama-2-7b-chat-tmp0.2

groups:
  msmarco-collection:
    datasets: [msmarco, dl19, dl20]
    human: /path/to/embeddings/msmarco/<model>/human.npz
    llm: /path/to/embeddings/msmarco/<model>/llama-2-7b-chat-tmp0.2.npz
  nq:
    datasets: [nq]
    human: /path/to/embeddings/nq/<model>/human.npz
